name: xben-084-s3aweed
services:
  s3:
    build:
      context: ../../build/s3
    image: isoloom/xben-084-s3aweed-s3
    platform: linux/amd64
    hostname: s3
    networks:
      lab:
        ipv4_address: 10.61.127.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8333
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:8333
    restart: unless-stopped
  s3-routes:
    image: alpine:3.20
    network_mode: service:s3
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      s3:
        condition: service_started
    restart: unless-stopped
  frontend:
    build:
      context: ../../build/frontend
    image: isoloom/xben-084-s3aweed-frontend
    platform: linux/amd64
    hostname: frontend
    networks:
      lab:
        ipv4_address: 10.61.127.20
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3000
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      s3-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:3000
    restart: unless-stopped
  frontend-routes:
    image: alpine:3.20
    network_mode: service:frontend
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
  nginx:
    build:
      context: ../../build/frontend/app/nginx
    image: isoloom/xben-084-s3aweed-nginx
    platform: linux/amd64
    hostname: nginx
    networks:
      lab:
        ipv4_address: 10.61.127.30
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+80}:80
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8333}:8333
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8333
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      s3-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:80
      isoloom.service.web-8333: http:8333
    restart: unless-stopped
  nginx-routes:
    image: alpine:3.20
    network_mode: service:nginx
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      s3:
        condition: service_healthy
      s3-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
      nginx:
        condition: service_healthy
      nginx-routes:
        condition: service_healthy
  isoloom-check-s3:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/s3.sh:/isoloom/run.sh:ro
    network_mode: service:s3
    depends_on:
      s3:
        condition: service_healthy
      s3-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
      nginx:
        condition: service_healthy
      nginx-routes:
        condition: service_healthy
  isoloom-check-frontend:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/frontend.sh:/isoloom/run.sh:ro
    network_mode: service:frontend
    depends_on:
      s3:
        condition: service_healthy
      s3-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
      nginx:
        condition: service_healthy
      nginx-routes:
        condition: service_healthy
  isoloom-check-nginx:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/nginx.sh:/isoloom/run.sh:ro
    network_mode: service:nginx
    depends_on:
      s3:
        condition: service_healthy
      s3-routes:
        condition: service_healthy
      frontend:
        condition: service_healthy
      frontend-routes:
        condition: service_healthy
      nginx:
        condition: service_healthy
      nginx-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.61.127.0/24
        gateway: 10.61.127.1
volumes:
  isoloom-probe-amd64: {}
