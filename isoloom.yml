# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-084-24 S3aweed (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Next.js frontend with an S3-compatible storage service behind nginx.
# The benchmark folder benchmarks/XBEN-084-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/frontend/app/ (its s3/ in build/s3/app/), built by its own Dockerfiles; the overlay in build/frontend/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-084-s3aweed

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.127.0/24, internet: false}

machines:
  s3:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    ports:
      web:
        port: 8333
        protocol: http
    app:
      build: build/s3
  frontend:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [s3]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 3000
        protocol: http
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/frontend

  nginx:
    networks: {lab: 30}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [s3, frontend]
    ports:
      web:
        port: 80
        protocol: http
        publish: true
      web-8333:
        port: 8333
        protocol: http
        publish: true
    app:
      build: build/frontend/app/nginx
checks:
  - name: the S3aweed page answers
    http: http://nginx:80/
    wait: 180
  - name: the S3 service answers through nginx
    script: checks/probe.sh
    wait: 60

message: |
  S3aweed answers at {{ machines.nginx.ports.web.url }}.
  Find the gold bucket. Hint: search for hidden directories.
